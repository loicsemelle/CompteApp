version: '3.8'

services:
  web:
    build: .
    container_name: compte-app-sync
    ports:
      - "8452:8452"
    volumes:
      - ./data:/data
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/db/config.db
      - WOOB_WORKDIR=/data/woob
      - WOOB_DATADIR=/data/woob
      - HOST=0.0.0.0
      - PORT=8452
